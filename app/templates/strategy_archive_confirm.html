{% extends "base.html" %}
{% block title %}Archive strategy?{% endblock %}
{% block content %}
  <p><a href="{{ url_for('routes.strategy_detail', strategy_id=strategy.id) }}">&larr; Cancel</a></p>
  <h1>Archive "{{ strategy.title }}"?</h1>

  <div class="card">
    <p>Archived strategies drop off the active list on the Goals page and stay in history.</p>
    <form method="post" action="{{ url_for('routes.archive_strategy', strategy_id=strategy.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field-label">Reason (required)</label>
      <input type="text" name="reason" required>
      <button type="submit">Archive</button>
    </form>
    <a href="{{ url_for('routes.strategy_detail', strategy_id=strategy.id) }}"><button type="button" class="secondary">Cancel</button></a>
  </div>
{% endblock %}
