<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Financial Agent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">

  <!-- Installable app (PWA) — manifest + icons only, no service worker,
       no offline caching of anything authenticated. -->
  <link rel="manifest" href="{{ url_for('pwa.manifest') }}">
  <meta name="theme-color" content="#0a5">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Household">
</head>
<body>
  <div class="page">
    <nav>
      <a href="{{ url_for('routes.dashboard') }}">Numbers</a>
      <a href="{{ url_for('routes.goals_list') }}">Goals</a>
      <a href="{{ url_for('routes.confirm_stale') }}">Confirm stale</a>
    </nav>
    <div class="topbar">
      <span>{{ user.email }} ({{ user.role }})</span>
      <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="secondary small">Sign out</button>
      </form>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flashes">
      {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
